name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build and run tests
        run: ./gradlew clean build
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: tradeeverything
          path: build/libs/tradeeverything-0.1.0.jar
