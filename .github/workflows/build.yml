name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build and run tests
        run: ./gradlew clean build
      - name: Resolve mod JAR path
        id: mod_jar
        shell: bash
        run: |
          archives_base_name="$(grep '^archives_base_name=' gradle.properties | cut -d= -f2-)"
          mod_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          jar_path="build/libs/${archives_base_name}-${mod_version}.jar"

          if [[ -z "$archives_base_name" || -z "$mod_version" ]]; then
            echo "::error::Could not resolve archives_base_name or mod_version from gradle.properties"
            exit 1
          fi
          if [[ ! -f "$jar_path" ]]; then
            echo "::error::Expected mod JAR was not found: $jar_path"
            echo "Contents of build/libs/:"
            ls -la build/libs/ || true
            exit 1
          fi

          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: tradeeverything
          path: ${{ steps.mod_jar.outputs.path }}
          if-no-files-found: error
